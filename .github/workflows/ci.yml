name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx oxlint packages apps scripts
      - run: bunx tsc --noEmit -p packages/shared/tsconfig.publish.json
      - run: bunx tsc --noEmit -p packages/agent/tsconfig.publish.json
      - run: bunx tsc --noEmit -p packages/server/tsconfig.publish.json
      - run: bunx tsc --noEmit -p packages/plugin/tsconfig.publish.json
      - run: bun run build:publish
      - run: npm pack --dry-run --json
