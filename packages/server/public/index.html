<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>http-tracker</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0b0e14;
        color: #e6e6e6;
        margin: 0;
        padding: 1rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 4px 8px;
        border-bottom: 1px solid #1d2430;
        font-size: 13px;
      }
      td.m {
        font-weight: 700;
      }
      .GET {
        color: #4ad295;
      }
      .POST {
        color: #54a7ff;
      }
      .PUT {
        color: #c07af0;
      }
      .DELETE {
        color: #ff6b6b;
      }
      .OTHER {
        color: #cfd3dc;
      }
    </style>
  </head>
  <body>
    <h1>http-tracker</h1>
    <button id="clear">Clear</button>
    <table>
      <thead>
        <tr>
          <th>T</th>
          <th>Method</th>
          <th>URL</th>
          <th>Status</th>
          <th>ms</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <script src="./app.js"></script>
  </body>
</html>
